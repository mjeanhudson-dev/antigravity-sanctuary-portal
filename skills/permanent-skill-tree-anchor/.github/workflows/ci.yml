name: Permanent Skill-Tree Anchor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    name: ${{ matrix.os }} (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        mode: [stdlib, pyyaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional PyYAML
        if: matrix.mode == 'pyyaml'
        run: python -m pip install --no-cache-dir pyyaml
      - name: Run 8-case Popperian self-test (zero bytecode)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B scripts/anchor_probe.py --selftest
      - name: Verify example anchor state & init round-trip
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          python -B scripts/anchor_probe.py verify --state examples/anchor_state.example.json
          tmpdir="$(mktemp -d)"
          python -B scripts/anchor_probe.py init --out "$tmpdir/anchor_state.json"
          python -B scripts/anchor_probe.py verify --state "$tmpdir/anchor_state.json"
