  </defs>
  <rect x="44" y="44" width="424" height="424" rx="108" fill="url(#an-bg)" stroke="url(#an-gold)" stroke-width="18"/>
  <!-- Golden anchor ring + crossbar + shank + curved arms + flukes -->
  <circle cx="256" cy="128" r="34" fill="none" stroke="url(#an-gold)" stroke-width="24"/>
  <rect x="156" y="190" width="200" height="28" rx="14" fill="url(#an-gold)"/>
  <rect x="241" y="158" width="30" height="244" rx="15" fill="url(#an-gold)"/>
  <path d="M124 294 C132 368 188 408 256 408 C324 408 380 368 388 294" fill="none" stroke="url(#an-gold)" stroke-width="30" stroke-linecap="round"/>
  <polygon points="104,316 128,256 164,302" fill="#FEF08A"/>
  <polygon points="408,316 384,256 348,302" fill="#FEF08A"/>
  <!-- Cyan carbon core gem at crossbar junction -->
  <polygon points="256,174 286,204 256,234 226,204" fill="#38BDF8" stroke="#0C0A09" stroke-width="10"/>
</svg>
